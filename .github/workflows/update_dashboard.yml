# クレカ動画ランキングダッシュボードを毎日自動更新し、GitHub Pages に反映する。
#
# 流れ:
#   1. YouTube API でトップ5を取得（fetch_videos.py）
#   2. Jinja2 テンプレートから index.html / ranking.json を生成（generate_html.py）
#   3. LINE Flex Message を送信（notify_line.py）
#   4. 変更があれば main ブランチへコミット＆プッシュ
#
# GitHub Pages は main ブランチの静的ファイルをそのまま公開する構成を想定。

name: Update YouTube Dashboard

on:
  schedule:
    # 毎日 22:00 UTC = 翌日 07:00 JST
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/youtube-dashboard

    steps:
      # リポジトリをチェックアウト（後続ステップでコミット＆プッシュする）
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 3.11（ubuntu-latest 向けの安定版）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/youtube-dashboard/requirements.txt

      # requests / Jinja2 をインストール
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # GitHub Secrets の API キーを環境変数として Python に渡す
      - name: Generate dashboard HTML
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python generate_html.py

      # ranking.json を読み込み、LINE Flex Message を送信
      - name: Send LINE notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python notify_line.py

      # 生成された index.html のみをコミット（変更がない場合はスキップ）
      - name: Commit and push updated dashboard
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/youtube-dashboard/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$(cat <<'EOF'
          chore(youtube-dashboard): update daily ranking dashboard

          EOF
          )"
            git push
          fi
