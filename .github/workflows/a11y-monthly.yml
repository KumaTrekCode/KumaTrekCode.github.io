name: Accessibility (monthly)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: axe on local static server
        run: npm run lint:a11y
